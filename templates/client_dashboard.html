<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    {% if favicon_url %}<link rel="icon" href="https://danilka007tuk.github.io/{{ site_id }}/{{ favicon_url }}">{% endif %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои записи — {{ logo_text }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: {{ color_primary }};
            --secondary: {{ color_secondary }};
            --bg: {{ color_bg }};
            --text: {{ color_text }};
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.15);
            --card-hover: rgba(255, 255, 255, 0.1);
            --text-muted: rgba(255, 255, 255, 0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0d0d0d;
            background-image: {% if favicon_url %}url('https://danilka007tuk.github.io/{{ site_id }}/{{ favicon_url }}'){% else %}none{% endif %};
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: -1;
        }

        .header {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 {
            font-size: 1.1em;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 14px;
            letter-spacing: 0.02em;
            color: #fff;
        }
        .header h1 img { height: 34px; border-radius: 4px; }
        .header-actions { display: flex; gap: 12px; align-items: center; }
        .header-actions a, .header-actions button {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 400;
            font-size: 0.8em;
            letter-spacing: 0.08em;
            padding: 8px 18px;
            border-radius: 4px;
            border: 1px solid var(--card-border);
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .header-actions a:hover, .header-actions button:hover {
            color: #fff;
            background: var(--card-hover);
            border-color: var(--primary);
        }
        .header-actions .logout-btn { color: #ff6b6b; border-color: rgba(255, 107, 107, 0.3); }
        .header-actions .logout-btn:hover { background: rgba(255, 107, 107, 0.15); }
        .header-actions .btn-help { color: var(--primary); border-color: var(--primary); }

        .container {
            max-width: 1280px;
            margin: 40px auto;
            padding: 0 40px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }
        .dashboard-tile {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            min-height: 140px;
        }
        .dashboard-tile:hover {
            background: var(--card-hover);
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        .dashboard-tile .tile-icon { font-size: 2.2em; margin-bottom: 16px; opacity: 0.9; }
        .dashboard-tile h2 {
            font-size: 0.95em;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 6px;
        }
        .dashboard-tile p { font-size: 0.8em; color: var(--text-muted); line-height: 1.5; }

        .bottom-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 32px;
            margin-top: 20px;
        }
        .bottom-panel h3 {
            font-size: 0.9em;
            margin-bottom: 20px;
            color: #fff;
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 12px;
            font-size: 0.7em;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--card-border);
        }
        td {
            padding: 14px 12px;
            font-size: 0.9em;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #fff;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(255,255,255,0.02); }
        .empty { text-align: center; color: var(--text-muted); padding: 32px; font-style: italic; font-size: 0.9em; }

        .tour-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 9998; display: none; }
        .tour-tooltip { position: fixed; background: rgba(15, 15, 15, 0.98); color: #fff; padding: 24px; border-radius: 6px; font-family: Inter, sans-serif; max-width: 380px; z-index: 10000; box-shadow: 0 20px 60px rgba(0,0,0,0.8); border: 1px solid var(--primary); }
        .tour-tooltip h3 { margin: 0 0 12px 0; color: var(--primary); font-size: 0.95em; letter-spacing: 0.08em; text-transform: uppercase; }
        .tour-tooltip p { margin: 0 0 20px 0; color: var(--text-muted); line-height: 1.6; }
        .tour-tooltip .tour-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .tour-tooltip button { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 0.75em; letter-spacing: 0.1em; text-transform: uppercase; }
        .tour-tooltip button.skip { background: transparent; color: var(--text-muted); padding: 10px 0; }
        .tour-tooltip button.skip:hover { color: #fff; }
        .tour-highlight { position: relative; z-index: 9999 !important; box-shadow: 0 0 0 2px var(--primary), 0 0 30px rgba(0,0,0,0.5) !important; border-radius: 6px !important; }

        @media (max-width: 900px) {
            .container { padding: 0 20px; }
            .header { padding: 16px 20px; flex-wrap: wrap; gap: 12px; }
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>
        {% if favicon_url %}<img src="https://danilka007tuk.github.io/{{ site_id }}/{{ favicon_url }}" alt="">{% endif %}
        {{ logo_text }}
    </h1>
    <div class="header-actions">
        <a href="https://danilka007tuk.github.io/{{ site_id }}/?skip_redirect=1" target="_blank" id="tour-link-site">Сайт</a>
        <a href="#" class="logout-btn" id="tour-link-logout" onclick="logoutUser(event)">Выйти</a>
        <button class="btn-help" onclick="startTour(true)">❓ Помощь</button>
    </div>
</div>

<div class="container">
    <div class="dashboard-grid" id="tour-tabs">
        <div class="dashboard-tile" onclick="scrollToBookings()">
            <div class="tile-icon">📅</div>
            <div>
                <h2>Мои записи</h2>
                <p>Все ваши бронирования на услуги</p>
            </div>
        </div>
        <div class="dashboard-tile" onclick="window.open('https://danilka007tuk.github.io/{{ site_id }}/?skip_redirect=1', '_blank')">
            <div class="tile-icon">🔗</div>
            <div>
                <h2>На сайт</h2>
                <p>Вернуться на главную и забронировать ещё</p>
            </div>
        </div>
    </div>

    <div class="bottom-panel" id="tour-table">
        <h3>Список ваших записей</h3>
        <table>
            <thead>
                <tr>
                    <th>Дата</th>
                    <th>Время</th>
                    <th>Мастер</th>
                    <th>Услуга</th>
                    <th>Статус</th>
                </tr>
            </thead>
            <tbody id="bookingsBody">
                <tr><td colspan="5" class="empty">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SITE_ID = "{{ site_id }}";
    const SERVER_URL = "{{ server_url }}";
    const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    async function logoutUser(e) {
        if (e) e.preventDefault();
        try { await fetch(`${SERVER_URL}/logout`, { credentials: 'include' }); } catch (err) {}
        window.location.href = `${SERVER_URL}/login?site_id=${encodeURIComponent(SITE_ID)}`;
    }

    function scrollToBookings() {
        document.getElementById('tour-table').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    async function loadBookings() {
        const tbody = document.getElementById('bookingsBody');
        try {
            const res = await fetch(`${SERVER_URL}/api/my-bookings`, { credentials: 'include' });
            const data = await res.json();
            if (!data.ok) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty">${esc(data.error) || 'Ошибка авторизации. Войдите заново.'}</td></tr>`;
                return;
            }
            if (!data.bookings || data.bookings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty">У вас пока нет записей</td></tr>';
                return;
            }
            tbody.innerHTML = data.bookings.map(b => `
                <tr>
                    <td>${esc(b.date)}</td>
                    <td>${esc(b.time)}</td>
                    <td>${esc(b.master) || '—'}</td>
                    <td>${esc(b.service)}</td>
                    <td>✅ Подтверждена</td>
                </tr>
            `).join('');
        } catch (e) {
            console.error("Ошибка загрузки", e);
            tbody.innerHTML = '<tr><td colspan="5" class="empty">Ошибка загрузки данных</td></tr>';
        }
    }
    loadBookings();

    // === ТУТОРИАЛ ===
    const tourSteps = [
        { selector: '.header', title: 'Личный кабинет', text: 'Здесь вы видите свои бронирования.' },
        { selector: '#tour-link-site', title: 'Сайт', text: 'Кнопка «Сайт» возвращает вас на главную страницу.' },
        { selector: '#tour-tabs', title: 'Разделы', text: 'Нажмите на плитку, чтобы перейти к записям или на сайт.' },
        { selector: '#tour-table', title: 'Ваши записи', text: 'Здесь отображаются все ваши бронирования.' },
        { selector: '#tour-link-logout', title: 'Выход', text: 'Кнопка «Выйти» завершает сессию.' }
    ];

    let currentTourIndex = 0;
    const overlay = document.createElement('div');
    overlay.className = 'tour-overlay';
    document.body.appendChild(overlay);

    function startTour(force = false) {
        const tourKey = 'tour_completed_client_v8_' + SITE_ID;
        if (!force && localStorage.getItem(tourKey)) return;
        currentTourIndex = 0;
        overlay.style.display = 'block';
        showTourStep();
    }

    function showTourStep() {
        document.querySelectorAll('.tour-highlight').forEach(el => el.classList.remove('tour-highlight'));
        const oldTooltip = document.querySelector('.tour-tooltip');
        if (oldTooltip) oldTooltip.remove();
        if (currentTourIndex >= tourSteps.length) { endTour(); return; }
        const step = tourSteps[currentTourIndex];
        const el = document.querySelector(step.selector);
        if (!el) { currentTourIndex++; showTourStep(); return; }
        el.classList.add('tour-highlight');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const tooltip = document.createElement('div');
        tooltip.className = 'tour-tooltip';
        tooltip.innerHTML = `<h3>${step.title}</h3><p>${step.text}</p><div class="tour-actions"><button class="skip" onclick="endTour()">Пропустить</button><button onclick="nextTourStep()">Далее (${currentTourIndex + 1}/${tourSteps.length})</button></div>`;
        const rect = el.getBoundingClientRect();
        let top = rect.bottom + window.scrollY + 16;
        if (top > window.innerHeight + window.scrollY) top = rect.top + window.scrollY - 160;
        tooltip.style.top = top + 'px';
        tooltip.style.left = Math.max(16, Math.min(rect.left, window.innerWidth - 400)) + 'px';
        document.body.appendChild(tooltip);
    }

    function nextTourStep() { currentTourIndex++; showTourStep(); }
    function endTour() {
        document.querySelectorAll('.tour-highlight').forEach(el => el.classList.remove('tour-highlight'));
        overlay.style.display = 'none';
        const oldTooltip = document.querySelector('.tour-tooltip');
        if (oldTooltip) oldTooltip.remove();
        localStorage.setItem('tour_completed_client_v8_' + SITE_ID, '1');
    }

    setTimeout(() => startTour(false), 1000);
</script>
</body>
</html>
