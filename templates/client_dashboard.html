<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    {% if favicon_url %}
    <link
        rel="icon"
        href="{{ favicon_url | e }}"
    >
    {% endif %}

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Мои записи — {{ logo_text | e }}
    </title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --primary: {{ color_primary | e }};
            --secondary: {{ color_secondary | e }};
            --bg: {{ color_bg | e }};
            --text: {{ color_text | e }};
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.15);
            --card-hover: rgba(255, 255, 255, 0.1);
            --text-muted: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            position: relative;
            color: #fff;
            background: #0d0d0d;
            background-image:
                {% if favicon_url %}
                url('{{ favicon_url | e }}');
                {% else %}
                none;
                {% endif %}
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: "Inter", sans-serif;
            line-height: 1.6;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        button:focus-visible,
        a:focus-visible,
        [tabindex]:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 3px;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 40px;
            border-bottom: 1px solid var(--card-border);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .header h1 {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
            color: #fff;
            font-size: 1.1em;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .header h1 span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header h1 img {
            width: 34px;
            height: 34px;
            flex: 0 0 auto;
            border-radius: 4px;
            object-fit: cover;
        }

        .header-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-actions a,
        .header-actions button {
            padding: 8px 18px;
            border: 1px solid var(--card-border);
            border-radius: 4px;
            color: var(--text-muted);
            background: transparent;
            font: inherit;
            font-size: 0.8em;
            letter-spacing: 0.08em;
            text-decoration: none;
            cursor: pointer;
            transition:
                color 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .header-actions a:hover,
        .header-actions button:hover {
            border-color: var(--primary);
            color: #fff;
            background: var(--card-hover);
        }

        .header-actions .logout-btn {
            border-color: rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .header-actions .logout-btn:hover {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.15);
        }

        .header-actions .btn-help {
            border-color: var(--primary);
            color: var(--primary);
        }

        .container {
            max-width: 1280px;
            margin: 40px auto;
            padding: 0 40px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .dashboard-tile {
            display: flex;
            flex-direction: column;
            min-height: 140px;
            padding: 24px;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            background: var(--card-bg);
            cursor: pointer;
            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .dashboard-tile:hover {
            border-color: var(--primary);
            background: var(--card-hover);
            transform: translateY(-2px);
        }

        .dashboard-tile .tile-icon {
            margin-bottom: 16px;
            opacity: 0.9;
            font-size: 2.2em;
        }

        .dashboard-tile h2 {
            margin-bottom: 6px;
            color: #fff;
            font-size: 0.95em;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .dashboard-tile p {
            color: var(--text-muted);
            font-size: 0.8em;
            line-height: 1.5;
        }

        .bottom-panel {
            margin-top: 20px;
            padding: 32px;
            overflow-x: auto;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            background: var(--card-bg);
        }

        .bottom-panel h3 {
            margin-bottom: 20px;
            color: #fff;
            font-size: 0.9em;
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 620px;
            border-collapse: collapse;
        }

        th {
            padding: 12px;
            border-bottom: 1px solid var(--card-border);
            color: var(--text-muted);
            font-size: 0.7em;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-align: left;
            text-transform: uppercase;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.9em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .empty {
            padding: 32px;
            color: var(--text-muted);
            font-size: 0.9em;
            font-style: italic;
            text-align: center;
        }

        .empty a {
            color: var(--primary);
        }

        .retry-btn {
            margin-top: 14px;
            padding: 9px 16px;
            border: 1px solid var(--primary);
            border-radius: 4px;
            color: #fff;
            background: transparent;
            cursor: pointer;
            font: inherit;
            font-size: 0.85em;
        }

        .retry-btn:hover {
            background: var(--primary);
        }

        .tour-overlay {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: none;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .tour-tooltip {
            position: absolute;
            z-index: 10000;
            width: min(380px, calc(100vw - 32px));
            padding: 24px;
            border: 1px solid var(--primary);
            border-radius: 6px;
            color: #fff;
            background: rgba(15, 15, 15, 0.98);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .tour-tooltip h3 {
            margin-bottom: 12px;
            color: var(--primary);
            font-size: 0.95em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .tour-tooltip p {
            margin-bottom: 20px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .tour-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .tour-tooltip button {
            padding: 10px 20px;
            border: 0;
            border-radius: 4px;
            color: #fff;
            background: var(--primary);
            cursor: pointer;
            font: inherit;
            font-size: 0.75em;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .tour-tooltip button.skip {
            padding: 10px 0;
            color: var(--text-muted);
            background: transparent;
        }

        .tour-tooltip button.skip:hover {
            color: #fff;
        }

        .tour-highlight {
            position: relative;
            z-index: 9999 !important;
            border-radius: 6px !important;
            box-shadow:
                0 0 0 2px var(--primary),
                0 0 30px rgba(0, 0, 0, 0.5) !important;
        }

        @media (max-width: 900px) {
            .container {
                padding: 0 20px;
            }

            .header {
                align-items: flex-start;
                flex-wrap: wrap;
                padding: 16px 20px;
            }

            .header-actions {
                width: 100%;
                justify-content: flex-start;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .container {
                margin-top: 24px;
            }

            .bottom-panel {
                padding: 20px 12px;
            }

            .header-actions a,
            .header-actions button {
                padding: 8px 12px;
                font-size: 0.72em;
            }

            .tour-tooltip {
                position: fixed;
                top: auto !important;
                right: 16px !important;
                bottom: 16px !important;
                left: 16px !important;
                width: auto;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <h1>
            {% if favicon_url %}
            <img
                src="{{ favicon_url | e }}"
                alt=""
                loading="lazy"
            >
            {% endif %}

            <span>{{ logo_text | e }}</span>
        </h1>

        <nav
            class="header-actions"
            aria-label="Навигация личного кабинета"
        >
            <a
                href="#"
                id="tour-link-site"
                target="_blank"
                rel="noopener noreferrer"
            >
                Сайт
            </a>

            <a
                href="#"
                id="tour-link-logout"
                class="logout-btn"
            >
                Выйти
            </a>

            <button
                type="button"
                class="btn-help"
                id="helpButton"
            >
                ❓ Помощь
            </button>
        </nav>
    </header>

    <main class="container">
        <section
            class="dashboard-grid"
            id="tour-tabs"
            aria-label="Разделы кабинета"
        >
            <div
                class="dashboard-tile"
                id="bookingsTile"
                role="button"
                tabindex="0"
                aria-label="Перейти к моим записям"
            >
                <div class="tile-icon" aria-hidden="true">📅</div>

                <div>
                    <h2>Мои записи</h2>
                    <p>Все ваши бронирования на услуги</p>
                </div>
            </div>

            <div
                class="dashboard-tile"
                id="siteTile"
                role="button"
                tabindex="0"
                aria-label="Открыть сайт"
            >
                <div class="tile-icon" aria-hidden="true">🔗</div>

                <div>
                    <h2>На сайт</h2>
                    <p>Вернуться на главную и забронировать ещё</p>
                </div>
            </div>
        </section>

        <section
            class="bottom-panel"
            id="tour-table"
            aria-labelledby="bookingsTitle"
        >
            <h3 id="bookingsTitle">
                Список ваших записей
            </h3>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Дата</th>
                            <th scope="col">Время</th>
                            <th scope="col">Мастер</th>
                            <th scope="col">Услуга</th>
                            <th scope="col">Статус</th>
                        </tr>
                    </thead>

                    <tbody id="bookingsBody">
                        <tr>
                            <td
                                colspan="5"
                                class="empty"
                            >
                                Загрузка…
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        "use strict";

        const SITE_ID = {{ site_id | tojson }};
        const SERVER_URL = {{ server_url | tojson }};

        const SITE_URL =
            `https://danilka007tuk.github.io/${encodeURIComponent(SITE_ID)}/`;

        const LOGIN_URL =
            `${SERVER_URL}/login?site_id=${encodeURIComponent(SITE_ID)}`;

        const bookingsBody =
            document.getElementById("bookingsBody");

        const tourTable =
            document.getElementById("tour-table");

        const siteLink =
            document.getElementById("tour-link-site");

        const logoutLink =
            document.getElementById("tour-link-logout");

        const helpButton =
            document.getElementById("helpButton");

        const bookingsTile =
            document.getElementById("bookingsTile");

        const siteTile =
            document.getElementById("siteTile");

        function esc(value) {
            return String(value == null ? "" : value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function showError(message, withLogin = false) {
            const safeMessage = esc(message);

            const loginLink = withLogin
                ? `
                    <br>
                    <a
                        href="${esc(LOGIN_URL)}"
                        style="color: var(--primary);"
                    >
                        Войти заново
                    </a>
                `
                : "";

            bookingsBody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        ${safeMessage}
                        ${loginLink}
                        <br>
                        <button
                            type="button"
                            class="retry-btn"
                            id="retryBookingsButton"
                        >
                            Повторить
                        </button>
                    </td>
                </tr>
            `;

            const retryButton =
                document.getElementById("retryBookingsButton");

            if (retryButton) {
                retryButton.addEventListener(
                    "click",
                    loadBookings,
                );
            }
        }

        function scrollToBookings() {
            tourTable.scrollIntoView({
                behavior: "smooth",
                block: "center",
            });
        }

        async function logoutUser(event) {
            event.preventDefault();

            try {
                await fetch(
                    `${SERVER_URL}/logout`,
                    {
                        method: "GET",
                        credentials: "include",
                        cache: "no-store",
                    },
                );
            } catch (error) {
                console.warn(
                    "Не удалось выполнить запрос выхода",
                    error,
                );
            } finally {
                window.location.assign(LOGIN_URL);
            }
        }

        function openSite() {
            window.open(
                `${SITE_URL}?skip_redirect=1`,
                "_blank",
                "noopener,noreferrer",
            );
        }

        let bookingsLoading = false;

        async function loadBookings() {
            if (bookingsLoading) {
                return;
            }

            bookingsLoading = true;

            bookingsBody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        Загрузка…
                    </td>
                </tr>
            `;

            try {
                const response = await fetch(
                    `${SERVER_URL}/api/my-bookings`,
                    {
                        method: "GET",
                        credentials: "include",
                        cache: "no-store",
                        headers: {
                            "Accept": "application/json",
                        },
                    },
                );

                let data = null;

                try {
                    data = await response.json();
                } catch (parseError) {
                    throw new Error(
                        "Сервер вернул некорректный ответ",
                    );
                }

                if (!response.ok || !data || !data.ok) {
                    const message =
                        data && data.error
                            ? data.error
                            : "Сессия истекла";

                    showError(message, true);
                    return;
                }

                if (
                    !Array.isArray(data.bookings)
                    || data.bookings.length === 0
                ) {
                    bookingsBody.innerHTML = `
                        <tr>
                            <td
                                colspan="5"
                                class="empty"
                            >
                                У вас пока нет записей
                            </td>
                        </tr>
                    `;
                    return;
                }

                bookingsBody.innerHTML = data.bookings
                    .map((booking) => {
                        const date = esc(booking.date);
                        const time = esc(booking.time);
                        const master =
                            esc(booking.master) || "—";
                        const service =
                            esc(booking.service);

                        return `
                            <tr>
                                <td>${date}</td>
                                <td>${time}</td>
                                <td>${master}</td>
                                <td>${service}</td>
                                <td>✅ Подтверждена</td>
                            </tr>
                        `;
                    })
                    .join("");
            } catch (error) {
                console.error(
                    "Ошибка загрузки записей",
                    error,
                );

                showError(
                    "Ошибка загрузки данных",
                    false,
                );
            } finally {
                bookingsLoading = false;
            }
        }

        const tourSteps = [
            {
                selector: ".header",
                title: "Личный кабинет",
                text: "Здесь вы видите свои бронирования.",
            },
            {
                selector: "#tour-link-site",
                title: "Сайт",
                text: "Эта кнопка открывает главную страницу сайта.",
            },
            {
                selector: "#tour-tabs",
                title: "Разделы",
                text: "Нажмите на плитку, чтобы перейти к записям или на сайт.",
            },
            {
                selector: "#tour-table",
                title: "Ваши записи",
                text: "Здесь отображаются все ваши бронирования.",
            },
            {
                selector: "#tour-link-logout",
                title: "Выход",
                text: "Эта кнопка завершает текущую сессию.",
            },
        ];

        let currentTourIndex = 0;

        const overlay =
            document.createElement("div");

        overlay.className = "tour-overlay";
        overlay.setAttribute(
            "aria-hidden",
            "true",
        );
        document.body.appendChild(overlay);

        function getTourStorageKey() {
            return (
                "tour_completed_client_v10_"
                + String(SITE_ID)
            );
        }

        function isTourCompleted() {
            try {
                return Boolean(
                    window.localStorage.getItem(
                        getTourStorageKey(),
                    ),
                );
            } catch (error) {
                return false;
            }
        }

        function markTourCompleted() {
            try {
                window.localStorage.setItem(
                    getTourStorageKey(),
                    "1",
                );
            } catch (error) {
                console.warn(
                    "localStorage недоступен",
                    error,
                );
            }
        }

        function removeTourHighlight() {
            document
                .querySelectorAll(".tour-highlight")
                .forEach((element) => {
                    element.classList.remove(
                        "tour-highlight",
                    );
                });
        }

        function removeTourTooltip() {
            const tooltip =
                document.querySelector(".tour-tooltip");

            if (tooltip) {
                tooltip.remove();
            }
        }

        function endTour() {
            removeTourHighlight();
            removeTourTooltip();

            overlay.style.display = "none";
            overlay.setAttribute(
                "aria-hidden",
                "true",
            );

            markTourCompleted();
        }

        function showTourStep() {
            removeTourHighlight();
            removeTourTooltip();

            if (
                currentTourIndex >= tourSteps.length
            ) {
                endTour();
                return;
            }

            const step =
                tourSteps[currentTourIndex];

            const element =
                document.querySelector(
                    step.selector,
                );

            if (!element) {
                currentTourIndex += 1;
                showTourStep();
                return;
            }

            element.classList.add(
                "tour-highlight",
            );

            element.scrollIntoView({
                behavior: "smooth",
                block: "center",
            });

            const tooltip =
                document.createElement("div");

            tooltip.className = "tour-tooltip";
            tooltip.setAttribute(
                "role",
                "dialog",
            );
            tooltip.setAttribute(
                "aria-label",
                step.title,
            );

            const title =
                document.createElement("h3");

            title.textContent = step.title;

            const text =
                document.createElement("p");

            text.textContent = step.text;

            const actions =
                document.createElement("div");

            actions.className = "tour-actions";

            const skipButton =
                document.createElement("button");

            skipButton.type = "button";
            skipButton.className = "skip";
            skipButton.textContent = "Пропустить";
            skipButton.addEventListener(
                "click",
                endTour,
            );

            const nextButton =
                document.createElement("button");

            nextButton.type = "button";
            nextButton.textContent =
                currentTourIndex === tourSteps.length - 1
                    ? "Завершить"
                    : `Далее (${currentTourIndex + 1}/${tourSteps.length})`;

            nextButton.addEventListener(
                "click",
                () => {
                    currentTourIndex += 1;
                    showTourStep();
                },
            );

            actions.append(
                skipButton,
                nextButton,
            );

            tooltip.append(
                title,
                text,
                actions,
            );

            document.body.appendChild(
                tooltip,
            );

            if (window.innerWidth > 600) {
                const rect =
                    element.getBoundingClientRect();

                const tooltipRect =
                    tooltip.getBoundingClientRect();

                let top =
                    rect.bottom
                    + window.scrollY
                    + 16;

                const maxTop =
                    window.scrollY
                    + window.innerHeight
                    - tooltipRect.height
                    - 16;

                const topAlternative =
                    rect.top
                    + window.scrollY
                    - tooltipRect.height
                    - 16;

                if (top > maxTop) {
                    top = Math.max(
                        16,
                        topAlternative,
                    );
                }

                const left = Math.max(
                    16,
                    Math.min(
                        rect.left,
                        window.innerWidth
                        - tooltipRect.width
                        - 16,
                    ),
                );

                tooltip.style.top =
                    `${top}px`;

                tooltip.style.left =
                    `${left}px`;
            }
        }

        function startTour(force = false) {
            if (!force && isTourCompleted()) {
                return;
            }

            currentTourIndex = 0;
            overlay.style.display = "block";
            overlay.setAttribute(
                "aria-hidden",
                "false",
            );

            showTourStep();
        }

        siteLink.href =
            `${SITE_URL}?skip_redirect=1`;

        siteLink.addEventListener(
            "click",
            (event) => {
                event.preventDefault();
                openSite();
            },
        );

        logoutLink.addEventListener(
            "click",
            logoutUser,
        );

        helpButton.addEventListener(
            "click",
            () => startTour(true),
        );

        bookingsTile.addEventListener(
            "click",
            scrollToBookings,
        );

        bookingsTile.addEventListener(
            "keydown",
            (event) => {
                if (
                    event.key === "Enter"
                    || event.key === " "
                ) {
                    event.preventDefault();
                    scrollToBookings();
                }
            },
        );

        siteTile.addEventListener(
            "click",
            openSite,
        );

        siteTile.addEventListener(
            "keydown",
            (event) => {
                if (
                    event.key === "Enter"
                    || event.key === " "
                ) {
                    event.preventDefault();
                    openSite();
                }
            },
        );

        overlay.addEventListener(
            "click",
            (event) => {
                if (event.target === overlay) {
                    endTour();
                }
            },
        );

        document.addEventListener(
            "keydown",
            (event) => {
                if (
                    event.key === "Escape"
                    && overlay.style.display === "block"
                ) {
                    endTour();
                }
            },
        );

        loadBookings();

        window.setTimeout(
            () => startTour(false),
            1000,
        );
    </script>
</body>
</html>
