<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    {% if favicon_url %}<link rel="icon" href="https://danilka007tuk.github.io/{{ site_id }}/{{ favicon_url }}">{% endif %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет мастера — {{ logo_text }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* === ЦВЕТА === */
        :root {
            --primary: {{ color_primary }};
            --bg: #0d0d0d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.15);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
        }

        /* === БАЗА === */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            background-image: {% if favicon_url %}url('https://danilka007tuk.github.io/{{ site_id }}/{{ favicon_url }}'){% else %}none{% endif %};
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        body::before { content: ""; position: fixed; inset: 0; background: rgba(10,10,10,0.5); z-index: -1; }

        /* === ШАПКА === */
        .header {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: 1.1em;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
        }
        .header h1 img { height: 32px; border-radius: 4px; }
        .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .header a, .header button {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8em;
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid var(--card-border);
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .header a:hover, .header button:hover {
            color: #fff;
            background: rgba(255,255,255,0.1);
            border-color: var(--primary);
        }
        .header .logout-btn { color: #ff6b6b; border-color: rgba(255,107,107,0.3); }
        .header .btn-help { color: var(--primary); border-color: var(--primary); }

        /* === КОНТЕЙНЕР === */
        .container { max-width: 1280px; margin: 40px auto; padding: 0 40px; }

        /* === ПЛИТКИ РАЗДЕЛОВ === */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 32px; }
        .tile {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tile:hover { background: rgba(255,255,255,0.1); border-color: var(--primary); }
        .tile .icon { font-size: 2em; margin-bottom: 16px; }
        .tile h2 { font-size: 0.9em; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; margin-bottom: 6px; }
        .tile p { font-size: 0.8em; color: var(--text-muted); }

        /* === ПАНЕЛЬ === */
        .panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 6px; padding: 32px; }
        .panel h3 { font-size: 0.9em; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; margin-bottom: 20px; }

        /* === ТАБЛИЦА === */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); border-bottom: 1px solid var(--card-border); }
        td { padding: 14px 12px; font-size: 0.9em; border-bottom: 1px solid rgba(255,255,255,0.05); }
        tr:last-child td { border-bottom: none; }
        .empty { text-align: center; color: var(--text-muted); padding: 32px; font-style: italic; }

        /* === ГРАФИК === */
        .sched-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sched-row:last-child { border-bottom: none; }
        .sched-day { font-weight: 500; }
        .sched-time { color: var(--primary); font-weight: 500; }
        .sched-off { color: var(--text-muted); font-style: italic; }

        /* === ТУТОРИАЛ === */
        .tour-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 9998; display: none; }
        .tour-tooltip { position: fixed; background: rgba(15,15,15,0.98); padding: 24px; border-radius: 6px; max-width: 380px; z-index: 10000; border: 1px solid var(--primary); box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
        .tour-tooltip h3 { color: var(--primary); margin: 0 0 12px; font-size: 0.95em; text-transform: uppercase; letter-spacing: 0.08em; }
        .tour-tooltip p { color: var(--text-muted); margin: 0 0 20px; }
        .tour-tooltip .actions { display: flex; justify-content: space-between; gap: 12px; }
        .tour-tooltip button { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 0.75em; text-transform: uppercase; }
        .tour-tooltip button.skip { background: transparent; color: var(--text-muted); }
        .tour-highlight { box-shadow: 0 0 0 2px var(--primary), 0 0 30px rgba(0,0,0,0.5) !important; border-radius: 6px !important; }

        /* === АДАПТИВ === */
        @media (max-width: 900px) {
            .container { padding: 0 20px; }
            .grid { grid-template-columns: 1fr; }
            .header { padding: 16px 20px; }
            .panel { padding: 20px; }
        }
        @media (max-width: 600px) {
            th:nth-child(4), td:nth-child(4) { display: none; }
        }
    </style>
</head>
<body>

<!-- ШАПКА -->
<div class="header">
    <h1>
        {% if favicon_url %}<img src="https://danilka007tuk.github.io/{{ site_id }}/{{ favicon_url }}" alt="">{% endif %}
        {{ logo_text }}
    </h1>
    <div class="header-actions">
        <a href="{{ server_url }}/login?site_id={{ site_id }}" target="_blank">Вход</a>
        <a href="https://danilka007tuk.github.io/{{ site_id }}/?skip_redirect=1" target="_blank">Сайт</a>
        <a href="#" class="logout-btn" onclick="logoutUser(event)">Выйти</a>
        <button class="btn-help" onclick="startTour(true)">❓ Помощь</button>
    </div>
</div>

<!-- КОНТЕНТ -->
<div class="container">
    <div class="grid">
        <div class="tile" onclick="switchTab('bookings')">
            <div class="icon">📅</div>
            <h2>Мои записи</h2>
            <p>Клиенты, которые к вам записались</p>
        </div>
        <div class="tile" onclick="switchTab('schedule')">
            <div class="icon">🗓️</div>
            <h2>Мой график</h2>
            <p>Дни и часы вашей работы</p>
        </div>
    </div>

    <div class="panel">
        <!-- ВКЛАДКА ЗАПИСИ -->
        <div id="tab-bookings">
            <h3>Записи</h3>
            <table>
                <thead>
                    <tr><th>Дата</th><th>Время</th><th>Клиент</th><th>Телефон</th><th>Услуга</th></tr>
                </thead>
                <tbody id="bookingsBody">
                    <tr><td colspan="5" class="empty">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- ВКЛАДКА ГРАФИК -->
        <div id="tab-schedule" style="display:none;">
            <h3>График работы</h3>
            <div id="scheduleBody"><p class="empty">Загрузка...</p></div>
        </div>
    </div>
</div>

<!-- СКРИПТ -->
<script>
    const SITE_ID = "{{ site_id }}";
    const SERVER_URL = "{{ server_url }}";
    const WEEKDAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
    const email = (localStorage.getItem('master_email') || '').trim().toLowerCase();
    const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    // Выход
    async function logoutUser(e) {
        if (e) e.preventDefault();
        try { await fetch(`${SERVER_URL}/logout`, { credentials: 'include' }); } catch (err) {}
        window.location.href = `${SERVER_URL}/login?site_id=${encodeURIComponent(SITE_ID)}`;
    }

    // Переключение вкладок
    function switchTab(tab) {
        document.getElementById('tab-bookings').style.display = tab === 'bookings' ? 'block' : 'none';
        document.getElementById('tab-schedule').style.display = tab === 'schedule' ? 'block' : 'none';
    }

    // Загрузка записей
    async function loadBookings() {
        const tbody = document.getElementById('bookingsBody');
        if (!email) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty">Сессия истекла. Войдите заново.</td></tr>';
            return;
        }
        try {
            const res = await fetch(`${SERVER_URL}/api/master-bookings?email=${encodeURIComponent(email)}&site_id=${encodeURIComponent(SITE_ID)}`, { credentials: 'include' });
            const data = await res.json();
            if (!data.ok || !data.bookings || data.bookings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty">У вас пока нет записей</td></tr>';
                return;
            }
            tbody.innerHTML = data.bookings.map(b => `
                <tr>
                    <td>${esc(b.date)}</td>
                    <td>${esc(b.time)}</td>
                    <td>${esc(b.name)}</td>
                    <td>${esc(b.phone)}</td>
                    <td>${esc(b.service)}</td>
                </tr>
            `).join('');
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty">Ошибка загрузки</td></tr>';
        }
    }

    // Загрузка графика
    async function loadSchedule() {
        const container = document.getElementById('scheduleBody');
        if (!email) {
            container.innerHTML = '<p class="empty">Сессия истекла. Войдите заново.</p>';
            return;
        }
        try {
            const res = await fetch(`${SERVER_URL}/api/master-schedule?email=${encodeURIComponent(email)}&site_id=${encodeURIComponent(SITE_ID)}`, { credentials: 'include' });
            const data = await res.json();
            if (!data.ok || !data.schedule || data.schedule.length === 0) {
                container.innerHTML = '<p class="empty">График не задан</p>';
                return;
            }
            const week = Array.from({length: 7}, (_, i) => ({ weekday: i, start_time: null, end_time: null }));
            data.schedule.forEach(item => { week[item.weekday] = item; });
            container.innerHTML = week.map(day => {
                const dayName = WEEKDAYS[day.weekday];
                if (day.start_time && day.end_time) {
                    return `<div class="sched-row"><span class="sched-day">${dayName}</span><span class="sched-time">${esc(day.start_time)} — ${esc(day.end_time)}</span></div>`;
                }
                return `<div class="sched-row"><span class="sched-day">${dayName}</span><span class="sched-off">Выходной</span></div>`;
            }).join('');
        } catch (e) {
            container.innerHTML = '<p class="empty">Ошибка загрузки графика</p>';
        }
    }

    loadBookings();
    loadSchedule();

    // === ТУТОРИАЛ ===
    const tourSteps = [
        { selector: '.header', title: 'Кабинет мастера', text: 'Здесь вы видите свои записи и график.' },
        { selector: '.grid', title: 'Разделы', text: 'Нажмите на плитку, чтобы открыть записи или график.' },
        { selector: '.panel', title: 'Данные', text: 'Здесь отображаются записи клиентов или ваш график.' }
    ];
    let currentIndex = 0;
    const overlay = document.createElement('div'); overlay.className = 'tour-overlay'; document.body.appendChild(overlay);

    function startTour(force = false) {
        const key = 'tour_master_' + SITE_ID;
        if (!force && localStorage.getItem(key)) return;
        currentIndex = 0;
        overlay.style.display = 'block';
        showStep();
    }
    function showStep() {
        document.querySelectorAll('.tour-highlight').forEach(el => el.classList.remove('tour-highlight'));
        const old = document.querySelector('.tour-tooltip'); if (old) old.remove();
        if (currentIndex >= tourSteps.length) { endTour(); return; }
        const step = tourSteps[currentIndex];
        const el = document.querySelector(step.selector);
        if (!el) { currentIndex++; showStep(); return; }
        el.classList.add('tour-highlight');
        el.scrollIntoView({behavior:'smooth', block:'center'});
        const t = document.createElement('div'); t.className = 'tour-tooltip';
        t.innerHTML = `<h3>${step.title}</h3><p>${step.text}</p><div class="actions"><button class="skip" onclick="endTour()">Пропустить</button><button onclick="nextStep()">Далее (${currentIndex+1}/${tourSteps.length})</button></div>`;
        const r = el.getBoundingClientRect();
        let top = r.bottom + window.scrollY + 16;
        if (top > window.innerHeight + window.scrollY) top = r.top + window.scrollY - 160;
        t.style.top = top + 'px';
        t.style.left = Math.max(16, Math.min(r.left, window.innerWidth - 400)) + 'px';
        document.body.appendChild(t);
    }
    function nextStep() { currentIndex++; showStep(); }
    function endTour() {
        document.querySelectorAll('.tour-highlight').forEach(el => el.classList.remove('tour-highlight'));
        overlay.style.display = 'none';
        const old = document.querySelector('.tour-tooltip'); if (old) old.remove();
        localStorage.setItem('tour_master_' + SITE_ID, '1');
    }
    setTimeout(() => startTour(false), 1000);
</script>
</body>
</html>
