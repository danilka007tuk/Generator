<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">

    {% if favicon_url %}
    <link
        rel="icon"
        href="https://danilka007tuk.github.io/{{ site_id | e }}/{{ favicon_url | e }}"
    >
    {% endif %}

    <title>Кабинет мастера — {{ logo_text | e }}</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --primary: {{ color_primary | e }};
            --bg: #0d0d0d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.15);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.62);
            --danger: #ff6b6b;
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            color: var(--text);
            background-color: var(--bg);

            {% if favicon_url %}
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.70),
                    rgba(0, 0, 0, 0.70)
                ),
                url("https://danilka007tuk.github.io/{{ site_id | e }}/{{ favicon_url | e }}");
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            {% endif %}

            font-family: "Inter", Arial, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: rgba(0, 0, 0, 0.25);
            pointer-events: none;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Шапка */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;

            width: 100%;
            padding: 14px 24px;

            background: rgba(0, 0, 0, 0.62);
            border-bottom: 1px solid var(--card-border);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .header-title img {
            width: 32px;
            height: 32px;
            flex: 0 0 auto;
            border-radius: 6px;
            object-fit: cover;
        }

        .header-title strong {
            overflow: hidden;
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .header-button {
            padding: 8px 14px;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .header-button:hover,
        .header-button:focus-visible {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            outline: none;
        }

        .header-button.logout {
            border-color: rgba(255, 107, 107, 0.4);
            color: var(--danger);
        }

        /* Контейнер */

        .container {
            width: min(1280px, 100%);
            margin: 0 auto;
            padding: 32px 24px 48px;
        }

        /* Плитки */

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .dashboard-tile {
            width: 100%;
            min-height: 140px;
            padding: 22px;

            border: 1px solid var(--card-border);
            border-radius: 8px;

            background: var(--card-bg);
            color: #fff;
            text-align: left;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .dashboard-tile:hover,
        .dashboard-tile:focus-visible {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            transform: translateY(-2px);
        }

        .dashboard-tile .tile-icon {
            margin-bottom: 8px;
            font-size: 1.9rem;
        }

        .dashboard-tile h2 {
            margin-bottom: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .dashboard-tile p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Панели */

        .panel {
            margin-bottom: 20px;
            padding: 28px;

            border: 1px solid var(--card-border);
            border-radius: 8px;

            background: var(--card-bg);
        }

        .panel-title {
            margin-bottom: 18px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* Таблица */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .table {
            width: 100%;
            min-width: 680px;
            border-collapse: collapse;
        }

        .table th {
            padding: 12px 10px;
            border-bottom: 1px solid var(--card-border);
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-align: left;
            text-transform: uppercase;
        }

        .table td {
            padding: 14px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            color: #fff;
            font-size: 0.9rem;
        }

        .table tr:last-child td {
            border-bottom: 0;
        }

        .empty {
            padding: 28px 16px !important;
            color: var(--text-muted) !important;
            font-style: italic;
            text-align: center !important;
        }

        /* Расписание */

        .schedule-list {
            display: grid;
            gap: 0;
        }

        .schedule-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;

            padding: 13px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .schedule-row:last-child {
            border-bottom: 0;
        }

        .schedule-day {
            font-weight: 500;
        }

        .schedule-time {
            color: var(--primary);
            font-weight: 600;
            text-align: right;
        }

        .schedule-off {
            color: var(--text-muted);
            font-style: italic;
        }

        .error-message {
            padding: 16px;
            color: var(--danger);
            text-align: center;
        }

        /* Адаптивность */

        @media (max-width: 760px) {
            .header {
                align-items: flex-start;
                flex-direction: column;
                padding: 14px 16px;
            }

            .header-actions {
                width: 100%;
                justify-content: flex-start;
            }

            .container {
                padding: 24px 16px 40px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 20px 16px;
            }
        }

        @media (max-width: 480px) {
            .header-button {
                flex: 1 1 auto;
                text-align: center;
            }

            .schedule-row {
                align-items: flex-start;
                flex-direction: column;
                gap: 4px;
            }

            .schedule-time {
                text-align: left;
            }
        }
    </style>
</head>

<body>
    <header class="header" aria-label="Шапка кабинета мастера">
        <div class="header-title">
            {% if favicon_url %}
            <img
                src="https://danilka007tuk.github.io/{{ site_id | e }}/{{ favicon_url | e }}"
                alt=""
                loading="lazy"
            >
            {% endif %}

            <strong>
                Кабинет мастера — {{ logo_text | e }}
            </strong>
        </div>

        <nav class="header-actions" aria-label="Навигация">
            <a
                class="header-button"
                href="{{ server_url | e }}/login?site_id={{ site_id | urlencode }}"
            >
                Вход
            </a>

            <a
                class="header-button"
                href="https://danilka007tuk.github.io/{{ site_id | e }}/?skip_redirect=1"
                target="_blank"
                rel="noopener noreferrer"
            >
                Сайт
            </a>

            <button
                class="header-button logout"
                id="logoutButton"
                type="button"
            >
                Выйти
            </button>
        </nav>
    </header>

    <main class="container">
        <section
            class="dashboard-grid"
            aria-label="Разделы кабинета мастера"
        >
            <button
                class="dashboard-tile"
                id="bookingsTile"
                type="button"
            >
                <div class="tile-icon" aria-hidden="true">📅</div>
                <h2>Мои записи</h2>
                <p>Клиенты, записавшиеся к вам</p>
            </button>

            <button
                class="dashboard-tile"
                id="scheduleTile"
                type="button"
            >
                <div class="tile-icon" aria-hidden="true">🗓️</div>
                <h2>Мой график</h2>
                <p>Дни и часы вашей работы</p>
            </button>
        </section>

        <section
            class="panel"
            id="bookingsSection"
            aria-labelledby="bookingsTitle"
        >
            <h2 class="panel-title" id="bookingsTitle">
                Мои записи
            </h2>

            <div class="table-wrapper">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Время</th>
                            <th>Клиент</th>
                            <th>Телефон</th>
                            <th>Услуга</th>
                        </tr>
                    </thead>

                    <tbody id="bookingsBody">
                        <tr>
                            <td colspan="5" class="empty">
                                Загрузка...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section
            class="panel"
            id="scheduleSection"
            aria-labelledby="scheduleTitle"
            hidden
        >
            <h2 class="panel-title" id="scheduleTitle">
                График работы
            </h2>

            <div
                class="schedule-list"
                id="scheduleBody"
                aria-live="polite"
            >
                <p class="empty">Загрузка...</p>
            </div>
        </section>
    </main>

    <script>
        "use strict";

        const SITE_ID = {{ site_id | tojson }};
        const SERVER_URL = {{ server_url | tojson }};

        const WEEKDAYS = [
            "Понедельник",
            "Вторник",
            "Среда",
            "Четверг",
            "Пятница",
            "Суббота",
            "Воскресенье"
        ];

        const bookingsSection = document.getElementById("bookingsSection");
        const scheduleSection = document.getElementById("scheduleSection");
        const bookingsBody = document.getElementById("bookingsBody");
        const scheduleBody = document.getElementById("scheduleBody");

        function apiUrl(path) {
            return `${SERVER_URL}${path}`;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function parseResponse(response) {
            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(
                    data.error || `Ошибка HTTP ${response.status}`
                );
            }

            return data;
        }

        function showBookings() {
            bookingsSection.hidden = false;
            scheduleSection.hidden = true;
            loadBookings();
        }

        function showSchedule() {
            bookingsSection.hidden = true;
            scheduleSection.hidden = false;
            loadSchedule();
        }

        async function loadBookings() {
            bookingsBody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">Загрузка...</td>
                </tr>
            `;

            try {
                const response = await fetch(
                    apiUrl(
                        `/api/master-bookings?site_id=${encodeURIComponent(SITE_ID)}`
                    ),
                    {
                        method: "GET",
                        credentials: "include",
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                const data = await parseResponse(response);

                if (!data.ok) {
                    throw new Error(
                        data.error || "Не удалось загрузить записи"
                    );
                }

                const bookings = Array.isArray(data.bookings)
                    ? data.bookings
                    : [];

                if (bookings.length === 0) {
                    bookingsBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="empty">
                                У вас пока нет записей
                            </td>
                        </tr>
                    `;
                    return;
                }

                bookingsBody.innerHTML = bookings.map((booking) => `
                    <tr>
                        <td>${escapeHtml(booking.date)}</td>
                        <td>${escapeHtml(booking.time)}</td>
                        <td>${escapeHtml(
                            booking.customer ||
                            booking.name ||
                            "—"
                        )}</td>
                        <td>${escapeHtml(booking.phone || "—")}</td>
                        <td>${escapeHtml(booking.service || "—")}</td>
                    </tr>
                `).join("");
            } catch (error) {
                console.error("Ошибка загрузки записей:", error);

                bookingsBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="error-message">
                            ${escapeHtml(
                                error.message || "Ошибка загрузки записей"
                            )}
                        </td>
                    </tr>
                `;
            }
        }

        async function loadSchedule() {
            scheduleBody.innerHTML = `
                <p class="empty">Загрузка...</p>
            `;

            try {
                const response = await fetch(
                    apiUrl(
                        `/api/master-schedule?site_id=${encodeURIComponent(SITE_ID)}`
                    ),
                    {
                        method: "GET",
                        credentials: "include",
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                const data = await parseResponse(response);

                if (!data.ok) {
                    throw new Error(
                        data.error || "Не удалось загрузить график"
                    );
                }

                const schedule = Array.isArray(data.schedule)
                    ? data.schedule
                    : [];

                const scheduleByDay = Array.from(
                    { length: 7 },
                    (_, weekday) => {
                        const item = schedule.find(
                            (entry) => Number(entry.weekday) === weekday
                        );

                        return {
                            weekday,
                            start: item?.start_time || "",
                            end: item?.end_time || ""
                        };
                    }
                );

                scheduleBody.innerHTML = scheduleByDay.map((day) => {
                    const isWorking = day.start && day.end;

                    return `
                        <div class="schedule-row">
                            <span class="schedule-day">
                                ${WEEKDAYS[day.weekday]}
                            </span>

                            ${
                                isWorking
                                    ? `<span class="schedule-time">
                                           ${escapeHtml(day.start)}
                                           —
                                           ${escapeHtml(day.end)}
                                       </span>`
                                    : `<span class="schedule-off">
                                           Выходной
                                       </span>`
                            }
                        </div>
                    `;
                }).join("");
            } catch (error) {
                console.error("Ошибка загрузки графика:", error);

                scheduleBody.innerHTML = `
                    <p class="error-message">
                        ${escapeHtml(
                            error.message || "Ошибка загрузки графика"
                        )}
                    </p>
                `;
            }
        }

        async function logoutUser() {
            const logoutButton = document.getElementById("logoutButton");

            if (logoutButton) {
                logoutButton.disabled = true;
                logoutButton.textContent = "Выход...";
            }

            try {
                await fetch(
                    apiUrl(
                        `/logout?site_id=${encodeURIComponent(SITE_ID)}`
                    ),
                    {
                        method: "GET",
                        credentials: "include"
                    }
                );
            } catch (error) {
                console.warn("Ошибка выхода:", error);
            } finally {
                window.location.href =
                    `${SERVER_URL}/login?site_id=${encodeURIComponent(SITE_ID)}`;
            }
        }

        document
            .getElementById("bookingsTile")
            .addEventListener("click", showBookings);

        document
            .getElementById("scheduleTile")
            .addEventListener("click", showSchedule);

        document
            .getElementById("logoutButton")
            .addEventListener("click", logoutUser);

        loadBookings();
    </script>
</body>
</html>
