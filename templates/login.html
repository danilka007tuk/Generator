<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — {{ site_id }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #667eea; --secondary: #764ba2; --bg: #f4f6fa; --text: #2c3e50; --accent: #667eea;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg), #ffffff);
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px; overflow: hidden; position: relative;
        }
        body::before, body::after {
            content: ""; position: absolute; border-radius: 50%;
            filter: blur(80px); opacity: 0.35; z-index: 0;
        }
        body::before { width: 500px; height: 500px; background: var(--primary); top: -150px; left: -150px; }
        body::after { width: 600px; height: 600px; background: var(--secondary); bottom: -200px; right: -200px; }
        .login-card {
            position: relative; z-index: 1;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px; padding: 48px 40px;
            max-width: 420px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .logo {
            text-align: center; font-size: 0.8em; font-weight: 500;
            letter-spacing: 0.3em; text-transform: uppercase;
            color: var(--primary); margin-bottom: 24px;
        }
        h1 { font-size: 1.6em; font-weight: 300; text-align: center; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #888; font-size: 0.9em; font-weight: 300; margin-bottom: 28px; line-height: 1.6; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.72em; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #999; margin-bottom: 10px; }
        .form-group input {
            width: 100%; padding: 16px 20px;
            border: 2px solid rgba(0,0,0,0.08); border-radius: 12px;
            font-size: 1em; font-family: 'Inter', sans-serif;
            font-weight: 300; background: rgba(255,255,255,0.7);
            color: var(--text); transition: all 0.3s;
        }
        .form-group input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(0,0,0,0.05); }
        .submit-btn {
            width: 100%; padding: 18px; background: var(--primary);
            color: #fff; border: none; border-radius: 12px;
            font-size: 0.85em; font-weight: 600;
            letter-spacing: 0.2em; text-transform: uppercase;
            cursor: pointer; transition: all 0.3s; margin-bottom: 16px;
        }
        .submit-btn:hover:not(:disabled) { background: var(--text); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .register-link { text-align: center; font-size: 0.85em; color: #888; }
        .register-link a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .message { margin-top: 20px; padding: 14px 18px; border-radius: 12px; font-size: 0.88em; text-align: center; line-height: 1.5; display: none; }
        .message.success { background: rgba(67, 160, 71, 0.1); color: #2e7d32; border: 1px solid rgba(67, 160, 71, 0.3); }
        .message.error { background: rgba(211, 47, 47, 0.1); color: #c62828; border: 1px solid rgba(211, 47, 47, 0.3); }
        @media (max-width: 600px) { .login-card { padding: 36px 24px; } }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo">{{ site_id }}</div>
    <h1>Добро пожаловать</h1>
    <p class="subtitle">Введите email и пароль, чтобы войти в личный кабинет</p>

    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
            <label for="password">Пароль (только для админа)</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button type="submit" class="submit-btn" id="loginBtn">Войти</button>
    </form>

    <div class="register-link">
        Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
    </div>

    <div id="message" class="message"></div>
</div>

<script>
    const SITE_ID = "{{ site_id }}";
    const SERVER_URL = "{{ server_url }}";

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const btn = document.getElementById('loginBtn');
        const msg = document.getElementById('message');

        btn.disabled = true; btn.textContent = 'Проверяю...';
        msg.style.display = 'none';

        try {
            const res = await fetch(`${SERVER_URL}/api/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ site_id: SITE_ID, email, password }),
            });
            const result = await res.json();

            if (result.ok) {
                msg.className = 'message success';
                msg.textContent = `✅ Вход выполнен как ${result.role === 'admin' ? 'Администратор' : 'Клиент'}. Перенаправление...`;
                msg.style.display = 'block';
                setTimeout(() => { window.location.href = result.redirect; }, 1000);
            } else {
                msg.className = 'message error';
                msg.textContent = `❌ ${result.error || 'Ошибка входа'}`;
                msg.style.display = 'block';
            }
        } catch (err) {
            msg.className = 'message error';
            msg.textContent = '❌ Ошибка сервера. Попробуйте позже.';
            msg.style.display = 'block';
        } finally {
            btn.disabled = false; btn.textContent = 'Войти';
        }
    });
</script>
</body>
</html>
