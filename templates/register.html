<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — {{ site_title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: {{ color_primary }}; --secondary: {{ color_secondary }}; --bg: {{ color_bg }}; --text: {{ color_text }}; --accent: {{ color_accent }};
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg), #ffffff);
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px; overflow: hidden; position: relative;
        }
        body::before, body::after {
            content: ""; position: absolute; border-radius: 50%;
            filter: blur(80px); opacity: 0.35; z-index: 0;
        }
        body::before { width: 500px; height: 500px; background: var(--primary); top: -150px; left: -150px; }
        body::after { width: 600px; height: 600px; background: var(--secondary); bottom: -200px; right: -200px; }
        .register-card {
            position: relative; z-index: 1;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px; padding: 48px 40px;
            max-width: 460px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .logo {
            text-align: center; font-size: 0.8em; font-weight: 500;
            letter-spacing: 0.3em; text-transform: uppercase;
            color: var(--primary); margin-bottom: 24px;
        }
        h1 { font-size: 1.6em; font-weight: 200; text-align: center; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #888; font-size: 0.9em; font-weight: 300; margin-bottom: 28px; line-height: 1.6; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.72em; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #999; margin-bottom: 10px; }
        .form-group input {
            width: 100%; padding: 16px 20px;
            border: 2px solid rgba(0,0,0,0.08); border-radius: 12px;
            font-size: 1em; font-family: 'Inter', sans-serif;
            font-weight: 300; background: rgba(255,255,255,0.7);
            color: var(--text); transition: all 0.3s;
        }
        .form-group input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(0,0,0,0.05); }
        .submit-btn {
            width: 100%; padding: 18px; background: var(--primary);
            color: #fff; border: none; border-radius: 12px;
            font-size: 0.85em; font-weight: 600;
            letter-spacing: 0.2em; text-transform: uppercase;
            cursor: pointer; transition: all 0.3s;
        }
        .submit-btn:hover:not(:disabled) { background: var(--text); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .message {
            margin-top: 20px; padding: 14px 18px; border-radius: 12px;
            font-size: 0.88em; text-align: center; line-height: 1.5; display: none;
        }
        .message.success { background: rgba(67, 160, 71, 0.1); color: #2e7d32; border: 1px solid rgba(67, 160, 71, 0.3); }
        .message.error { background: rgba(211, 47, 47, 0.1); color: #c62828; border: 1px solid rgba(211, 47, 47, 0.3); }
        .login-link { text-align: center; margin-top: 24px; font-size: 0.9em; color: #888; }
        .login-link a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .login-link a:hover { text-decoration: underline; }
        @media (max-width: 600px) { .register-card { padding: 36px 24px; } }
    </style>
</head>
<body>

<div class="register-card">
    <div class="logo">{{ company_name }}</div>
    <h1>Регистрация клиента</h1>
    <p class="subtitle">Введите email и придумайте пароль для входа</p>

    <form id="registerForm">
        <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
            <label for="reg-password">Пароль (минимум 6 символов)</label>
            <input type="password" id="reg-password" placeholder="••••••••" required minlength="6">
        </div>
        <div class="form-group">
            <label for="reg-password-confirm">Подтвердите пароль</label>
            <input type="password" id="reg-password-confirm" placeholder="••••••••" required minlength="6">
        </div>
        <button type="submit" class="submit-btn" id="reg-btn">Зарегистрироваться</button>
    </form>

    <div id="reg-message" class="message"></div>

    <div class="login-link">
        Уже есть аккаунт? <a href="{{ server_url }}/login?site_id={{ site_id }}">Войти</a>
    </div>
</div>

<script>
    const SERVER_URL = {{ server_url | default("https://api.generator-beloretsk.ru") | tojson }};
    const SITE_ID = {{ site_id | default("site") | tojson }};

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value.trim();
        const passwordConfirm = document.getElementById('reg-password-confirm').value.trim();
        const btn = document.getElementById('reg-btn');
        const msg = document.getElementById('reg-message');

        if (!email) {
            msg.className = 'message error';
            msg.textContent = '❌ Введите email';
            msg.style.display = 'block';
            return;
        }
        if (password.length < 6) {
            msg.className = 'message error';
            msg.textContent = '❌ Пароль должен быть минимум 6 символов';
            msg.style.display = 'block';
            return;
        }
        if (password !== passwordConfirm) {
            msg.className = 'message error';
            msg.textContent = '❌ Пароли не совпадают';
            msg.style.display = 'block';
            return;
        }

        btn.disabled = true; btn.textContent = 'Регистрирую...';
        msg.style.display = 'none';

        try {
            const res = await fetch(`${SERVER_URL}/api/register-client/${SITE_ID}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password }),
            });
            const result = await res.json();
            if (result.ok) {
                msg.className = 'message success';
                msg.textContent = '✅ Регистрация успешна! Сейчас перенаправим на вход...';
                msg.style.display = 'block';
                setTimeout(() => { window.location.href = `/login?site_id=${SITE_ID}`; }, 1500);
            } else {
                msg.className = 'message error';
                msg.textContent = `❌ ${result.error || 'Ошибка'}`;
                msg.style.display = 'block';
            }
        } catch (err) {
            msg.className = 'message error';
            msg.textContent = '❌ Не удалось отправить. Попробуйте позже.';
            msg.style.display = 'block';
        } finally {
            btn.disabled = false; btn.textContent = 'Зарегистрироваться';
        }
    });
</script>
</body>
</html>
