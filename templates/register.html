<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">

    {% if favicon_url %}
    <link
        rel="icon"
        href="https://danilka007tuk.github.io/{{ site_id }}/{{ favicon_url }}"
    >
    {% endif %}

    <title>Кабинет мастера — {{ logo_text }}</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --primary: {{ color_primary }};
            --primary-dark: color-mix(in srgb, var(--primary) 75%, #000);
            --bg: #0b0d10;
            --surface: rgba(255, 255, 255, 0.06);
            --surface-hover: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.14);
            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.62);
            --danger: #ff6b6b;
            --success: #66d19e;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background:
                linear-gradient(
                    rgba(5, 7, 10, 0.78),
                    rgba(5, 7, 10, 0.9)
                )
                {% if favicon_url %}
                , url("https://danilka007tuk.github.io/{{ site_id }}/{{ favicon_url }}")
                {% endif %};
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            background-color: var(--bg);
            color: var(--text);
            font-family: "Inter", Arial, sans-serif;
            line-height: 1.55;
        }

        button,
        a {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        :focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 3px;
        }

        /* Шапка */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            min-height: 72px;
            padding: 14px 28px;

            border-bottom: 1px solid var(--border);
            background: rgba(5, 7, 10, 0.8);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .header-title img {
            width: 34px;
            height: 34px;
            flex: 0 0 auto;
            border-radius: 8px;
            object-fit: cover;
        }

        .header-title strong {
            overflow: hidden;
            color: var(--text);
            font-size: 1rem;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .header-link,
        .logout-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 38px;
            padding: 8px 14px;

            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--muted);

            font-size: 0.8rem;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .header-link:hover,
        .logout-button:hover {
            border-color: var(--primary);
            background: var(--surface-hover);
            color: var(--text);
        }

        .logout-button {
            border-color: rgba(255, 107, 107, 0.4);
            color: var(--danger);
        }

        /* Основная область */

        .container {
            width: min(1240px, 100%);
            margin: 0 auto;
            padding: 36px 24px 56px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .dashboard-tile {
            min-height: 150px;
            padding: 24px;

            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);

            text-align: left;
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .dashboard-tile:hover {
            border-color: var(--primary);
            background: var(--surface-hover);
            transform: translateY(-3px);
        }

        .dashboard-tile.active {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .tile-icon {
            margin-bottom: 12px;
            font-size: 2rem;
        }

        .dashboard-tile h2 {
            margin-bottom: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .dashboard-tile p {
            color: var(--muted);
            font-size: 0.88rem;
        }

        .panel {
            margin-bottom: 20px;
            padding: 28px;

            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        .panel-title {
            color: var(--text);
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .refresh-button {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: transparent;
            color: var(--muted);
            font-size: 0.78rem;
        }

        .refresh-button:hover {
            border-color: var(--primary);
            color: var(--text);
        }

        /* Таблица */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .bookings-table {
            width: 100%;
            min-width: 680px;
            border-collapse: collapse;
        }

        .bookings-table th {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-align: left;
            text-transform: uppercase;
        }

        .bookings-table td {
            padding: 15px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            color: var(--text);
            font-size: 0.9rem;
        }

        .bookings-table tr:last-child td {
            border-bottom: 0;
        }

        .status {
            display: inline-flex;
            padding: 4px 9px;
            border-radius: 999px;
            background: rgba(102, 209, 158, 0.12);
            color: var(--success);
            font-size: 0.75rem;
            white-space: nowrap;
        }

        /* Расписание */

        .schedule-list {
            display: grid;
            gap: 0;
        }

        .schedule-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;

            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .schedule-row:last-child {
            border-bottom: 0;
        }

        .schedule-day {
            font-weight: 500;
        }

        .schedule-time {
            color: var(--primary);
            font-weight: 600;
            text-align: right;
        }

        .schedule-off {
            color: var(--muted);
            font-style: italic;
        }

        /* Состояния */

        .loading,
        .empty,
        .error {
            padding: 32px 16px;
            color: var(--muted);
            text-align: center;
        }

        .error {
            color: var(--danger);
        }

        .session-expired {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 30px 16px;
            color: var(--danger);
            text-align: center;
        }

        .login-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 10px 16px;
            border: 0;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .login-button:hover {
            background: var(--primary-dark);
        }

        /* Мобильная версия */

        @media (max-width: 760px) {
            .header {
                align-items: flex-start;
                flex-direction: column;
                padding: 14px 16px;
            }

            .header-actions {
                width: 100%;
                justify-content: flex-start;
            }

            .header-link,
            .logout-button {
                flex: 1 1 auto;
                text-align: center;
            }

            .container {
                padding: 24px 14px 40px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 20px 14px;
            }

            .panel-header {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .schedule-row {
                align-items: flex-start;
                flex-direction: column;
                gap: 5px;
            }

            .schedule-time {
                text-align: left;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <header class="header" aria-label="Шапка кабинета мастера">
        <div class="header-title">
            {% if favicon_url %}
            <img
                src="https://danilka007tuk.github.io/{{ site_id }}/{{ favicon_url }}"
                alt=""
                loading="lazy"
            >
            {% endif %}

            <strong>
                Кабинет мастера — {{ logo_text }}
            </strong>
        </div>

        <nav class="header-actions" aria-label="Навигация">
            <a
                class="header-link"
                href="{{ server_url }}/login?site_id={{ site_id }}"
            >
                Вход
            </a>

            <a
                class="header-link"
                href="https://danilka007tuk.github.io/{{ site_id }}/?skip_redirect=1"
                target="_blank"
                rel="noopener noreferrer"
            >
                Сайт
            </a>

            <button
                class="logout-button"
                id="logoutButton"
                type="button"
            >
                Выйти
            </button>
        </nav>
    </header>

    <main class="container">
        <section
            class="dashboard-grid"
            aria-label="Разделы кабинета"
        >
            <button
                class="dashboard-tile active"
                id="bookingsTile"
                type="button"
                aria-controls="bookingsSection"
            >
                <div class="tile-icon" aria-hidden="true">📅</div>
                <h2>Мои записи</h2>
                <p>Клиенты, которые записались к вам</p>
            </button>

            <button
                class="dashboard-tile"
                id="scheduleTile"
                type="button"
                aria-controls="scheduleSection"
            >
                <div class="tile-icon" aria-hidden="true">🗓️</div>
                <h2>Мой график</h2>
                <p>Дни и часы вашей работы</p>
            </button>
        </section>

        <section
            class="panel"
            id="bookingsSection"
            aria-labelledby="bookingsTitle"
        >
            <div class="panel-header">
                <h1 class="panel-title" id="bookingsTitle">
                    Мои записи
                </h1>

                <button
                    class="refresh-button"
                    id="refreshBookingsButton"
                    type="button"
                >
                    Обновить
                </button>
            </div>

            <div class="table-wrapper">
                <table class="bookings-table">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Время</th>
                            <th>Клиент</th>
                            <th>Телефон</th>
                            <th>Услуга</th>
                            <th>Статус</th>
                        </tr>
                    </thead>

                    <tbody id="bookingsBody">
                        <tr>
                            <td colspan="6" class="loading">
                                Загрузка записей...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section
            class="panel"
            id="scheduleSection"
            aria-labelledby="scheduleTitle"
            hidden
        >
            <div class="panel-header">
                <h2 class="panel-title" id="scheduleTitle">
                    График работы
                </h2>

                <button
                    class="refresh-button"
                    id="refreshScheduleButton"
                    type="button"
                >
                    Обновить
                </button>
            </div>

            <div
                class="schedule-list"
                id="scheduleBody"
                aria-live="polite"
            >
                <p class="loading">Загрузка графика...</p>
            </div>
        </section>
    </main>

    <script>
        "use strict";

        const SITE_ID = {{ site_id | tojson }};
        const SERVER_URL = {{ server_url | tojson }};

        const WEEKDAYS = [
            "Понедельник",
            "Вторник",
            "Среда",
            "Четверг",
            "Пятница",
            "Суббота",
            "Воскресенье"
        ];

        const bookingsTile = document.getElementById("bookingsTile");
        const scheduleTile = document.getElementById("scheduleTile");

        const bookingsSection = document.getElementById("bookingsSection");
        const scheduleSection = document.getElementById("scheduleSection");

        const bookingsBody = document.getElementById("bookingsBody");
        const scheduleBody = document.getElementById("scheduleBody");

        const logoutButton = document.getElementById("logoutButton");
        const refreshBookingsButton =
            document.getElementById("refreshBookingsButton");
        const refreshScheduleButton =
            document.getElementById("refreshScheduleButton");

        function buildUrl(path) {
            return `${SERVER_URL}${path}`;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function getJson(response) {
            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                const error = new Error(
                    data.error || `Ошибка HTTP ${response.status}`
                );

                error.status = response.status;
                error.data = data;

                throw error;
            }

            return data;
        }

        function setActiveSection(sectionName) {
            const showBookings = sectionName === "bookings";

            bookingsSection.hidden = !showBookings;
            scheduleSection.hidden = showBookings;

            bookingsTile.classList.toggle("active", showBookings);
            scheduleTile.classList.toggle("active", !showBookings);

            if (showBookings) {
                loadBookings();
            } else {
                loadSchedule();
            }
        }

        function showSessionExpired(container, colspan = null) {
            const content = `
                <div class="session-expired">
                    <div>Сессия истекла или доступ запрещён.</div>
                    <a
                        class="login-button"
                        href="${escapeHtml(
                            `${SERVER_URL}/login?site_id=${encodeURIComponent(SITE_ID)}`
                        )}"
                    >
                        Войти снова
                    </a>
                </div>
            `;

            if (colspan !== null) {
                container.innerHTML = `
                    <tr>
                        <td colspan="${colspan}">${content}</td>
                    </tr>
                `;
            } else {
                container.innerHTML = content;
            }
        }

        async function loadBookings() {
            bookingsBody.innerHTML = `
                <tr>
                    <td colspan="6" class="loading">
                        Загрузка записей...
                    </td>
                </tr>
            `;

            try {
                const response = await fetch(
                    buildUrl(
                        `/api/master-bookings?site_id=${encodeURIComponent(SITE_ID)}`
                    ),
                    {
                        method: "GET",
                        credentials: "include",
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                const data = await getJson(response);

                if (!data.ok) {
                    if (
                        response.status === 401 ||
                        response.status === 403
                    ) {
                        showSessionExpired(bookingsBody, 6);
                        return;
                    }

                    throw new Error(
                        data.error || "Не удалось загрузить записи"
                    );
                }

                const bookings = Array.isArray(data.bookings)
                    ? data.bookings
                    : [];

                if (bookings.length === 0) {
                    bookingsBody.innerHTML = `
                        <tr>
                            <td colspan="6" class="empty">
                                У вас пока нет записей
                            </td>
                        </tr>
                    `;
                    return;
                }

                bookingsBody.innerHTML = bookings.map((booking) => {
                    const status = booking.status || "Подтверждена";

                    return `
                        <tr>
                            <td>${escapeHtml(booking.date || "—")}</td>
                            <td>${escapeHtml(booking.time || "—")}</td>
                            <td>${escapeHtml(
                                booking.customer ||
                                booking.name ||
                                "—"
                            )}</td>
                            <td>${escapeHtml(booking.phone || "—")}</td>
                            <td>${escapeHtml(booking.service || "—")}</td>
                            <td>
                                <span class="status">
                                    ${escapeHtml(status)}
                                </span>
                            </td>
                        </tr>
                    `;
                }).join("");
            } catch (error) {
                console.error("Ошибка загрузки записей:", error);

                if (
                    error.status === 401 ||
                    error.status === 403
                ) {
                    showSessionExpired(bookingsBody, 6);
                    return;
                }

                bookingsBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="error">
                            ${escapeHtml(
                                error.message ||
                                "Не удалось загрузить записи"
                            )}
                        </td>
                    </tr>
                `;
            }
        }

        async function loadSchedule() {
            scheduleBody.innerHTML = `
                <p class="loading">Загрузка графика...</p>
            `;

            try {
                const response = await fetch(
                    buildUrl(
                        `/api/master-schedule?site_id=${encodeURIComponent(SITE_ID)}`
                    ),
                    {
                        method: "GET",
                        credentials: "include",
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                const data = await getJson(response);

                if (!data.ok) {
                    if (
                        response.status === 401 ||
                        response.status === 403
                    ) {
                        showSessionExpired(scheduleBody);
                        return;
                    }

                    throw new Error(
                        data.error || "Не удалось загрузить график"
                    );
                }

                const schedule = Array.isArray(data.schedule)
                    ? data.schedule
                    : [];

                const scheduleByDay = Array.from(
                    { length: 7 },
                    (_, weekday) => {
                        const item = schedule.find(
                            (entry) => Number(entry.weekday) === weekday
                        );

                        return {
                            weekday,
                            start: item?.start_time || "",
                            end: item?.end_time || ""
                        };
                    }
                );

                scheduleBody.innerHTML = scheduleByDay.map((day) => {
                    const hasWorkTime = day.start && day.end;

                    return `
                        <div class="schedule-row">
                            <span class="schedule-day">
                                ${WEEKDAYS[day.weekday]}
                            </span>

                            ${
                                hasWorkTime
                                    ? `
                                        <span class="schedule-time">
                                            ${escapeHtml(day.start)}
                                            —
                                            ${escapeHtml(day.end)}
                                        </span>
                                    `
                                    : `
                                        <span class="schedule-off">
                                            Выходной
                                        </span>
                                    `
                            }
                        </div>
                    `;
                }).join("");
            } catch (error) {
                console.error("Ошибка загрузки графика:", error);

                if (
                    error.status === 401 ||
                    error.status === 403
                ) {
                    showSessionExpired(scheduleBody);
                    return;
                }

                scheduleBody.innerHTML = `
                    <p class="error">
                        ${escapeHtml(
                            error.message ||
                            "Не удалось загрузить график"
                        )}
                    </p>
                `;
            }
        }

        async function logoutUser() {
            logoutButton.disabled = true;
            logoutButton.textContent = "Выход...";

            try {
                await fetch(
                    buildUrl(
                        `/logout?site_id=${encodeURIComponent(SITE_ID)}`
                    ),
                    {
                        method: "GET",
                        credentials: "include"
                    }
                );
            } catch (error) {
                console.warn("Ошибка при выходе:", error);
            } finally {
                window.location.href =
                    `${SERVER_URL}/login?site_id=${encodeURIComponent(SITE_ID)}`;
            }
        }

        bookingsTile.addEventListener("click", () => {
            setActiveSection("bookings");
        });

        scheduleTile.addEventListener("click", () => {
            setActiveSection("schedule");
        });

        refreshBookingsButton.addEventListener("click", loadBookings);
        refreshScheduleButton.addEventListener("click", loadSchedule);
        logoutButton.addEventListener("click", logoutUser);

        // При открытии страницы показываем записи.
        loadBookings();
    </script>
</body>
</html>
